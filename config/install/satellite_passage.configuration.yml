helptext:
  value: '<p>The KML files available on this page are retrieved from the <a href="https://sentinel.esa.int/web/sentinel/missions/sentinel-1/observation-scenario/acquisition-segments">Sentinel-1</a> and <a href="https://sentinel.esa.int/web/sentinel/missions/sentinel-2/acquisition-plans">Sentinel-2</a> ESA websites and filtered for the Norwegian area of interest. Available acquisition plans include Sentinel-1A and Sentinel-1C, and Sentinel-2A, Sentinel-2B, and Sentinel-2C. Each KML file usually covers 10-15 days. Use the Start and End sliders to filter acquisitions by observation time.</p><p>Click a passage to view its acquisition details. Sentinel-2 passages are highlighted in red. Sentinel-1 passages are highlighted in blue for EW mode (sea) and green for IW mode (land). Use the satellite checkboxes to show or hide individual satellites.</p>'
  format: 'basic_html'
